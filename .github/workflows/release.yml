name: release

# Versioning from the commit messages, which this repository already writes as
# conventional commits. release-please keeps a pull request open with the next
# version and the changelog it would produce; merging that pull request is the
# release, and only then is an image built and published.
#
# That last part is the point. The image used to be built on every push to
# every branch, which is a container build per commit for something nobody was
# going to run. Now it is built twice: once as a check, once for real.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: please
        # Configured by release-please-config.json and
        # .release-please-manifest.json at the repository root, so the version
        # and the changelog path are in the repository rather than in a
        # workflow input.

  # Only when a release was actually cut. Every other push to main ends at the
  # job above, which does nothing but keep a pull request up to date.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          # Shares the cache the pull-request check already warmed, so the
          # release build is not a cold one.
          cache-from: type=gha
          cache-to: type=gha,mode=max
