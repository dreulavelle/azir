name: ci

# Pushes to main and every pull request. Not every branch push: a branch with
# no pull request open is somebody still working, and building a container
# image for each of those is what turned a month's minutes into nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# One run per branch. Pushing five times in ten minutes used to start five full
# runs and let all five finish, which is five times the cost of the only answer
# anybody was waiting for — the last one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The canary test is the reason this job exists. It asserts that a
      # sentinel credential never reaches a log line, a persisted row, or an
      # outbound payload — turning "credentials do not leak" from a claim into
      # a check that fails the build.
      # No service container: the store package starts its own Postgres with
      # testcontainers, mounting deploy/postgres/postgresql.conf. That means CI
      # exercises the tuning we actually ship, so a typo in it fails here
      # rather than in a customer's deployment.
      - name: test
        run: go test ./... -race -count=1

      - name: no canary in the built binaries
        run: |
          go build -o /tmp/azir-bin ./cmd/...
          if grep -rq "AZIR-CANARY" /tmp/azir-bin 2>/dev/null; then
            echo "a canary sentinel was compiled into a shipped binary"; exit 1
          fi

      # Reachability-based, so it reports the vulnerabilities this code can
      # actually reach rather than every advisory touching the module graph.
      # A dependency is not a thing you audit once: this fails the build on the
      # day an advisory lands, which is the only day it is cheap to act on.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ci, not install: the lockfile is committed and a build that quietly
      # resolves something else is a build that proves nothing about what ships.
      - run: npm ci
      - run: npm run typecheck
      # The frontend is served from the same origin as the API and holds the
      # session cookie, so a compromised dependency here reaches everything the
      # signed-in technician can. high rather than every advisory: a job that
      # cries wolf on a transitive devDependency gets ignored, and an ignored
      # gate is worse than no gate.
      - run: npm audit --audit-level=high
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Layers are cached between runs, so a change to one Go file no longer
      # redownloads every dependency and rebuilds the frontend from nothing.
      # Loaded rather than pushed: this job proves the image works, and
      # publishing one is a release's job, not every commit's.
      - name: build the single image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: azir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: it starts, serves the ui, and supervises its plugins
        run: ./scripts/ci-image-check.sh azir:ci
