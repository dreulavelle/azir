name: azir

# Two services. Azir is one binary — embedded NATS with JetStream, the API, the
# frontend, and supervised plugins — and Postgres is the one external
# dependency, because semantic recall needs a real ANN index and ingest is
# genuinely concurrent.
services:
  azir:
    build:
      context: ..
      dockerfile: Dockerfile
    image: azir:local
    # Named so `docker logs azir` works without hunting for a generated
    # suffix. Overridable because a fixed name is exclusive on a host: a second
    # instance — a staging copy, or a clean one to reproduce something against —
    # cannot start while the name is taken.
    container_name: ${AZIR_CONTAINER_NAME:-azir}
    environment:
      DATABASE_URL: postgres://azir:${POSTGRES_PASSWORD:?run `make init` to generate .env}@postgres:5432/azir?sslmode=disable
      # No default, deliberately. A default here would be a working encryption
      # key published in the repository, and every deployment that never
      # changed it would be holding customer credentials sealed with a key
      # anyone can read. `make init` generates one; the vault refuses to start
      # without it.
      AZIR_MASTER_KEY: ${AZIR_MASTER_KEY:?run `make init` to generate .env}
      AZIR_LOG_LEVEL: ${AZIR_LOG_LEVEL:-info}
      # Set NATS_URL to point at an external cluster instead of the embedded
      # server. Everything else is unchanged when you do.
    ports:
      - "${AZIR_PORT:-8080}:8080"
    volumes:
      # JetStream's store. Postgres holds everything else.
      - azir-data:/var/lib/azir
      # Plugins that did not come with the image. Any executable named
      # plugin-<name> dropped in here is supervised alongside the bundled ones
      # on the next start — nothing to register, nothing to rebuild. Read-only,
      # because the container has no business writing to it, and it still has
      # to be approved in Settings before it can do anything.
      - ../plugins:/opt/azir/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Private search, so the assistant can look up a vendor advisory without a
  # search provider learning what your customers are having trouble with. No
  # published port: the only thing that talks to it is Azir, over the internal
  # network, and an instance reachable from outside would be one somebody else
  # could use to search on your behalf.
  searxng:
    image: searxng/searxng:latest
    container_name: ${AZIR_SEARCH_CONTAINER_NAME:-azir-search}
    environment:
      # SearXNG refuses to start without one, and a shared default would mean
      # every Azir deployment signing its sessions with the same key.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run `make init` to generate .env}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

  postgres:
    # pgvector is why this is Postgres; the image ships the extension so the
    # migration can simply CREATE EXTENSION.
    image: pgvector/pgvector:pg18
    container_name: ${AZIR_DB_CONTAINER_NAME:-azir-db}
    environment:
      POSTGRES_USER: azir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make init` to generate .env}
      POSTGRES_DB: azir
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      # Mounted at /var/lib/postgresql rather than .../data, which is what the
      # 18+ images expect: the cluster then lives in a version-named
      # subdirectory, so a future major upgrade can use `pg_upgrade --link`
      # without both versions straddling a mount boundary.
      - pg-data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      # Published for psql during development, off 5432 so a Postgres already
      # running on the host does not collide.
      - "${AZIR_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azir -d azir"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  azir-data:
  pg-data:
  searxng-cache:
