name: azir

# One service. Core embeds NATS with JetStream, SQLite and the frontend, and
# supervises bundled plugins as child processes. Compose is here for
# convenience — `docker run` works just as well.
services:
  azir:
    build:
      context: ..
      dockerfile: Dockerfile
    image: azir:local
    environment:
      # Development key only. Generate a real one with `make keygen` and pass
      # it as a Docker secret or platform secret anywhere that will hold a
      # customer's credentials.
      AZIR_MASTER_KEY: ${AZIR_MASTER_KEY:-YXppci1kZXZlbG9wbWVudC1rZXktbm90LXNlY3JldCE=}
      AZIR_LOG_LEVEL: ${AZIR_LOG_LEVEL:-info}
      # Set NATS_URL to point at an external cluster instead of the embedded
      # server. Everything else is unchanged when you do.
    ports:
      - "${AZIR_PORT:-8080}:8080"
    volumes:
      # SQLite and JetStream both live here. This is the backup surface.
      - azir-data:/var/lib/azir
    restart: unless-stopped

volumes:
  azir-data:
