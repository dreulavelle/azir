# SearXNG, as a private search backend for Azir's assistant.
#
# The point of running this rather than calling a search API is that queries
# about a customer's problem never leave the network. A hosted search provider
# would see "APC Smart-UPS 1500 battery self-test failure" alongside the IP it
# came from, which is a small leak that adds up across a helpdesk.
#
# Everything below is the minimum to make that work. The defaults SearXNG ships
# are otherwise kept, so an upgrade brings improvements rather than surprises.
use_default_settings: true

general:
  instance_name: "Azir search"
  # Nobody browses this instance; it answers one plugin.
  enable_metrics: false

search:
  # JSON is opt-in in SearXNG and is the whole reason this service exists here.
  # Without it every request comes back as a web page the plugin cannot read.
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: ""
  # Engines that answer a technical question well and quickly. The full default
  # set includes image, video and social engines that cost latency and return
  # nothing a helpdesk wants.
  default_lang: "en"

server:
  # The rate limiter exists to stop a public instance being scraped. This one is
  # not public — it is on an internal Docker network with no published port, and
  # its only caller is Azir. Leaving the limiter on would rate-limit the
  # assistant against itself.
  limiter: false
  public_instance: false
  image_proxy: false
  # Supplied as SEARXNG_SECRET by compose, generated by `make init`. Never
  # written down here: a secret in a repository is a secret everyone who clones
  # it now has.
  secret_key: ""

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 30
  pool_maxsize: 15
