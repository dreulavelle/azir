# Postgres tuning for Azir. Targets PostgreSQL 18.
#
# Baseline assumes a container allowed ~4 GB RAM on SSD-backed storage, which
# is a reasonable small-team deployment. Scale the memory settings with the
# container limit; the rest is workload shape and does not change.
#
# Deliberately a checked-in file rather than an autotuner. A generated config
# read at boot makes behaviour depend on the machine a container happened to
# land on, which turns "the query got slow" into an archaeology exercise. This
# is explicit, diffable, and reviewable.

# ---------------------------------------------------------------- connections
# Supplying config_file replaces the image's own defaults, and upstream
# listen_addresses is 'localhost' — which silently leaves Postgres reachable
# only from inside the container while pg_isready still passes over the Unix
# socket. Must be set explicitly here.
listen_addresses = '*'
port = 5432
max_connections = 100                 # the app pools at 16; the rest is headroom

# --------------------------------------------------------------------- memory
shared_buffers = 1GB                  # ~25% of RAM, the conventional starting point
effective_cache_size = 3GB            # ~75% of RAM: a hint to the planner, not an allocation
work_mem = 32MB                       # per sort/hash node. Vector queries with a filter
                                      # do real sorting, so the 4MB default is stingy —
                                      # but this multiplies by concurrent nodes, so it
                                      # cannot simply be made large.
maintenance_work_mem = 1GB            # HNSW index builds are memory-hungry and slow to a
                                      # crawl below this. Raised temporarily during a
                                      # large reindex if needed.
autovacuum_work_mem = 256MB           # MUST be set explicitly. The -1 default inherits
                                      # maintenance_work_mem, so the 1GB above would become
                                      # 1GB *per autovacuum worker* — 4GB on a container
                                      # sized for 4GB. Index builds want the large value;
                                      # autovacuum does not.

# --------------------------------------------------------------- query planner
random_page_cost = 1.1                # SSD: random reads cost nearly the same as sequential.
                                      # The 4.0 default assumes spinning rust and pushes the
                                      # planner away from index scans it should be using.
default_statistics_target = 100

# ---------------------------------------------------------------------- io (18)
# PostgreSQL 18 added asynchronous I/O. io_method=worker is the default and the
# only one that works here: io_uring fails under Docker's default seccomp
# profile with "could not setup io_uring queue: Operation not permitted". It is
# worth revisiting on a host where the container can be granted the syscalls,
# since vector index scans are read-heavy.
io_method = worker
io_workers = 4                        # default 3; vector scans issue a lot of reads

# In 18 this counts I/Os the executor tries to keep in flight rather than being
# a rough device-parallelism hint, so the old advice to set it in the hundreds
# no longer applies. 16 is the 18 default and a sane starting point.
effective_io_concurrency = 16

# pgvector queries are short and run often. JIT compilation regularly costs
# more than it saves on them, and is a well-known cause of surprising latency
# spikes in vector workloads.
jit = off

# ------------------------------------------------------------------ parallelism
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4  # parallel HNSW builds; the single biggest lever on
                                      # index build time

# ------------------------------------------------------------------------- wal
wal_compression = zstd
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9    # spread checkpoint IO instead of stalling in bursts

# --------------------------------------------------------------- observability
# Ingest backfill and vector search are where this will hurt first, so make
# slow queries visible rather than something to reproduce later.
log_min_duration_statement = 500      # ms
log_checkpoints = on
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d '

# ------------------------------------------------------------------- autovacuum
# Call records and the audit log are high-churn append tables. The defaults let
# dead tuples accumulate far too long on tables of that shape. These are the
# global floor; individual tables tighten further in migrations, because a
# setting that suits audit_log is wasteful on customers.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s
autovacuum_max_workers = 4
# The 200 default is a throttle inherited from spinning disks and is the usual
# reason autovacuum "cannot keep up" on modern storage. Raising it lets a
# worker actually finish before the table churns again.
autovacuum_vacuum_cost_limit = 2000
# New in 18: a hard row-count ceiling that triggers a vacuum regardless of the
# scale factor, which is what keeps large append-only tables from waiting on a
# percentage that never arrives.
autovacuum_vacuum_max_threshold = 500000

# --------------------------------------------------------------------- pgvector
# ef_search trades recall for latency at query time. 40 is the pgvector default;
# 100 buys noticeably better recall for a modest cost and is a better default
# for a corpus where missing the relevant ticket is the expensive failure.
hnsw.ef_search = 100
