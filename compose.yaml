name: azir

services:
  azir:
    build:
      context: .
      dockerfile: Dockerfile
    image: azir:local
    container_name: azir
    environment:
      DATABASE_URL: postgres://azir:${POSTGRES_PASSWORD:?run `make init` to generate .env}@postgres:5432/azir?sslmode=disable
      AZIR_MASTER_KEY: ${AZIR_MASTER_KEY:?run `make init` to generate .env}
      AZIR_LOG_LEVEL: ${AZIR_LOG_LEVEL:-info}
    ports:
      # One address, not all of them. Docker's default publishes on every
      # interface the host has — the LAN address, every container bridge, and
      # IPv6 — and this API is the front door to a credential vault.
      #
      # A tunnel or proxy elsewhere on the network needs a reachable address:
      # set AZIR_BIND to the one interface it arrives on, never back to
      # 0.0.0.0, and firewall that port to the proxy's address.
      - "${AZIR_BIND:-127.0.0.1}:${AZIR_PORT:-8080}:8080"
    volumes:
      - ./data:/var/lib/azir
      - ./plugins:/opt/azir/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: azir-search
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run `make init` to generate .env}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./cache:/var/cache/searxng
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: azir-db
    environment:
      POSTGRES_USER: azir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make init` to generate .env}
      POSTGRES_DB: azir
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - ./db:/var/lib/postgresql
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${AZIR_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azir -d azir"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

